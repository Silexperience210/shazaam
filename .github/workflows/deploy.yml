name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_KjCOoOnmn6peRNfoRgQwal0I
      VERCEL_PROJECT_ID: prj_81CXbzx5fwdmaQ6F4nU6ktLLP5em
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
